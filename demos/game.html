<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Nebula Siege — mini game · Jeffersom Ribeiro</title>
  <meta name="description" content="Mini game arcade feito do zero com Canvas 2D e JavaScript puro: ondas, chefes, upgrades e partículas." />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="kit.css" />
  <style>
    :root { --bg: #05040d; --fg: #eef0ff; --muted: #8f93b8; --accent: #7df9ff; --accent-2: #b26bff; --accent-ink: #05040d; --font-d: "Orbitron", sans-serif; --font-b: "Inter", sans-serif; }
    .viewport { overflow: hidden; }
    .game { position: absolute; inset: 0; user-select: none; -webkit-user-select: none; }
    #cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

    .hud { position: absolute; inset: 0; pointer-events: none; font: 700 13px/1 var(--font-d); letter-spacing: .08em; }
    .hud__l, .hud__r { position: absolute; top: 16px; display: flex; align-items: center; gap: 10px; }
    .hud__l { left: 16px; } .hud__r { right: 16px; gap: 16px; color: var(--muted); }
    .hud__r b { color: var(--fg); }
    .hp { width: 150px; height: 10px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; box-shadow: 0 0 0 1px rgba(125,249,255,.25); }
    .hp i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff4d8d, #ffa53d 50%, #7df9ff); transition: width .3s; }
    .hud__c { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); text-align: center; }
    .hud__c b { display: block; font-size: 26px; color: #fff; text-shadow: 0 0 18px rgba(125,249,255,.7); }
    .hud__c small { display: block; margin-top: 6px; color: #ffd23d; font-size: 11px; min-height: 11px; transition: transform .15s; }
    .xp { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.06); }
    .xp i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-2), var(--accent)); box-shadow: 0 0 12px var(--accent); transition: width .25s; }
    .boss { position: absolute; top: 64px; left: 50%; width: min(60%, 460px); transform: translateX(-50%); text-align: center; color: #d6b4ff; font-size: 11px; }
    .boss div { height: 8px; margin-top: 6px; border-radius: 99px; background: rgba(178,107,255,.15); overflow: hidden; box-shadow: 0 0 0 1px rgba(178,107,255,.5); }
    .boss i { display: block; height: 100%; background: linear-gradient(90deg, #ff4d8d, #b26bff); transition: width .2s; }
    .banner { position: absolute; top: 38%; left: 0; right: 0; text-align: center; pointer-events: none; opacity: 0;
      font: 900 clamp(28px, 7cqi, 64px)/1 var(--font-d); letter-spacing: .12em; color: #fff; text-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent-2); }
    .banner.show { animation: ban 1.7s var(--ease) both; }
    @keyframes ban { 0% { opacity: 0; transform: scale(1.6); letter-spacing: .5em; } 18% { opacity: 1; transform: none; letter-spacing: .12em; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }

    .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 50% 45%, rgba(5,4,13,.35), rgba(5,4,13,.85)); animation: screenIn .5s var(--ease) both; }
    .panel-g { width: min(100%, 560px); text-align: center; }
    .title { font: 900 clamp(38px, 9cqi, 84px)/.95 var(--font-d); letter-spacing: .04em; color: #fff;
      background: linear-gradient(180deg, #fff 30%, #7df9ff 60%, #b26bff); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 22px rgba(125,249,255,.45)); animation: glow 3s ease-in-out infinite alternate; }
    @keyframes glow { to { filter: drop-shadow(0 0 34px rgba(178,107,255,.7)); } }
    .sub { color: var(--muted); margin: 16px auto 0; max-width: 420px; line-height: 1.6; }
    .gbtn { margin-top: 28px; padding: 16px 38px; border: 0; border-radius: 14px; cursor: pointer; font: 900 16px/1 var(--font-d); letter-spacing: .14em;
      color: var(--accent-ink); background: linear-gradient(90deg, #7df9ff, #b26bff); box-shadow: 0 0 0 1px rgba(255,255,255,.3) inset, 0 16px 40px -10px rgba(125,249,255,.6); transition: transform .2s; }
    .gbtn:hover { transform: translateY(-2px) scale(1.04); }
    .meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 22px; font: 500 12px/1 "JetBrains Mono", monospace; color: var(--muted); }
    .meta span { padding: 7px 11px; border-radius: 99px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03); }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 26px; }
    .upg { padding: 22px 14px; border-radius: 18px; cursor: pointer; text-align: center; color: var(--fg); border: 1px solid rgba(125,249,255,.25);
      background: linear-gradient(180deg, rgba(125,249,255,.08), rgba(178,107,255,.06)); transition: transform .25s var(--ease), border-color .2s, box-shadow .25s; animation: screenIn .45s var(--ease) both; }
    .upg:hover, .upg:focus-visible { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 20px 50px -20px rgba(125,249,255,.6); outline: none; }
    .upg i { display: block; font-style: normal; font-size: 34px; color: var(--accent); text-shadow: 0 0 18px var(--accent); }
    .upg b { display: block; margin-top: 12px; font: 700 13px/1.2 var(--font-d); letter-spacing: .06em; }
    .upg small { display: block; margin-top: 8px; color: var(--muted); font-size: 12.5px; }
    .upg kbd { display: inline-block; margin-top: 10px; font: 500 11px/1 "JetBrains Mono", monospace; color: var(--muted); border: 1px solid rgba(255,255,255,.15); border-radius: 5px; padding: 3px 6px; }
    .stats-g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 22px; }
    .stats-g div { padding: 14px 8px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
    .stats-g b { display: block; font: 900 24px/1 var(--font-d); color: #fff; }
    .stats-g small { display: block; margin-top: 6px; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .pause-btn { position: absolute; left: 16px; bottom: 18px; width: 42px; height: 42px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(5,4,13,.6); color: #fff; cursor: pointer; font: 700 14px/1 var(--font-d); }
    @container (max-width: 600px) {
      .cards { grid-template-columns: 1fr; gap: 10px; }
      .upg { display: grid; grid-template-columns: 44px 1fr; text-align: left; align-items: center; padding: 14px; gap: 2px 12px; }
      .upg i { grid-row: span 2; font-size: 28px; } .upg b { margin: 0; } .upg small { margin: 0; } .upg kbd { display: none; }
      .hp { width: 90px; } .hud__r { gap: 10px; font-size: 11px; }
      .hud__c { top: 40px; } .boss { top: 92px; }
    }
  </style>
</head>
<body data-sector="game" data-nodevice>
<div class="stage"><main class="viewport">
  <section class="screen" id="play" data-label="Jogar" data-label-en="Play" data-label-es="Jugar">
    <div class="game" id="game">
      <canvas id="cv"></canvas>
      <div class="hud" id="hud" hidden>
        <div class="hud__l"><div class="hp"><i id="hpBar"></i></div><span id="hpTxt"></span></div>
        <div class="hud__c"><b id="score">0</b><small id="combo"></small></div>
        <div class="hud__r"><span id="waveTxt"></span><span id="lvlTxt"></span></div>
        <div class="boss" id="boss" hidden><span id="bossName">VOID WARDEN</span><div><i id="bossBar"></i></div></div>
        <div class="xp"><i id="xpBar"></i></div>
      </div>
      <div class="banner" id="banner"></div>

      <div class="overlay" id="menu">
        <div class="panel-g">
          <h1 class="title">NEBULA<br>SIEGE</h1>
          <p class="sub" id="tSub"></p>
          <button class="gbtn" id="playBtn"></button>
          <div class="meta"><span id="tHow"></span><span id="tBest"></span></div>
          <p class="sub small" id="tMade" style="margin-top:22px;font-size:12px"></p>
        </div>
      </div>
      <div class="overlay" id="levelup" hidden>
        <div class="panel-g" style="width:min(100%,680px)"><h2 class="title" style="font-size:clamp(26px,5cqi,42px)" id="tLvl"></h2><div class="cards" id="cards"></div></div>
      </div>
      <div class="overlay" id="paused" hidden>
        <div class="panel-g"><h2 class="title" style="font-size:clamp(30px,6cqi,52px)" id="tPaused"></h2><button class="gbtn" id="resumeBtn"></button></div>
      </div>
      <div class="overlay" id="over" hidden>
        <div class="panel-g">
          <h2 class="title" style="font-size:clamp(28px,6cqi,52px)" id="tOver"></h2>
          <div class="stats-g"><div><b id="oScore">0</b><small id="tScore"></small></div><div><b id="oWave">1</b><small id="tWave"></small></div><div><b id="oBest">0</b><small id="tBest2"></small></div></div>
          <button class="gbtn" id="againBtn"></button>
        </div>
      </div>
      <button class="pause-btn" id="pauseBtn" aria-label="Pause" hidden>II</button>
    </div>
  </section>
</main></div>
<script src="kit.js"></script>
<script>
(function () {
  "use strict";
  var D = window.Demo, $ = D.$;
  var L = {
    en: { sub: "Survive endless waves, level up your ship and take down the bosses.", play: "PLAY", again: "PLAY AGAIN", resume: "RESUME", paused: "PAUSED",
      how: "Mouse / WASD to move · auto-fire", howTouch: "Drag anywhere to move · auto-fire", best: "Best", wave: "WAVE", lvl: "LV", levelup: "LEVEL UP", over: "SHIP DESTROYED",
      score: "Score", boss: "⚠ BOSS INCOMING", made: "Built from scratch: Canvas 2D + vanilla JavaScript, no game engine.", combo: "COMBO" },
    pt: { sub: "Sobreviva às ondas, evolua sua nave e derrote os chefes.", play: "JOGAR", again: "JOGAR DE NOVO", resume: "CONTINUAR", paused: "PAUSADO",
      how: "Mouse / WASD para mover · tiro automático", howTouch: "Arraste em qualquer lugar · tiro automático", best: "Recorde", wave: "ONDA", lvl: "NV", levelup: "SUBIU DE NÍVEL", over: "NAVE DESTRUÍDA",
      score: "Pontos", boss: "⚠ CHEFE CHEGANDO", made: "Feito do zero: Canvas 2D + JavaScript puro, sem engine.", combo: "COMBO" },
    es: { sub: "Sobrevive a las oleadas, mejora tu nave y derrota a los jefes.", play: "JUGAR", again: "JUGAR DE NUEVO", resume: "CONTINUAR", paused: "PAUSA",
      how: "Mouse / WASD para moverte · disparo automático", howTouch: "Arrastra en cualquier lugar · disparo automático", best: "Récord", wave: "OLEADA", lvl: "NV", levelup: "SUBISTE DE NIVEL", over: "NAVE DESTRUIDA",
      score: "Puntos", boss: "⚠ SE ACERCA EL JEFE", made: "Hecho desde cero: Canvas 2D + JavaScript puro, sin motor.", combo: "COMBO" }
  }[D.lang];
  var UPG = [
    { ic: "⚡", n: ["Overclock", "Overclock", "Overclock"], d: ["+25% fire rate", "+25% cadência de tiro", "+25% cadencia"], f: function (p) { p.fireRate *= 1.25; } },
    { ic: "✳", n: ["Split shot", "Tiro duplo", "Disparo múltiple"], d: ["+1 projectile", "+1 projétil", "+1 proyectil"], f: function (p) { p.multi++; }, ok: function (p) { return p.multi < 6; } },
    { ic: "◆", n: ["Heavy rounds", "Munição pesada", "Munición pesada"], d: ["+1 damage", "+1 de dano", "+1 de daño"], f: function (p) { p.dmg++; } },
    { ic: "➶", n: ["Thrusters", "Propulsores", "Propulsores"], d: ["+15% speed", "+15% velocidade", "+15% velocidad"], f: function (p) { p.speed *= 1.15; } },
    { ic: "➤", n: ["Piercing", "Perfuração", "Perforación"], d: ["Shots pierce +1 enemy", "Tiros atravessam +1 inimigo", "Atraviesa +1 enemigo"], f: function (p) { p.pierce++; } },
    { ic: "♥", n: ["Nano hull", "Casco nano", "Casco nano"], d: ["+1 max HP & full heal", "+1 vida máx. e cura total", "+1 vida máx. y cura total"], f: function (p) { p.maxHp++; p.hp = p.maxHp; } },
    { ic: "✦", n: ["Orbit blades", "Lâminas orbitais", "Cuchillas orbitales"], d: ["+1 blade circling you", "+1 lâmina girando ao redor", "+1 cuchilla girando"], f: function (p) { p.blades++; }, ok: function (p) { return p.blades < 6; } },
    { ic: "◎", n: ["Magnet", "Ímã", "Imán"], d: ["+60% pickup range", "+60% alcance de coleta", "+60% rango de recogida"], f: function (p) { p.magnet *= 1.6; } }
  ];
  var LI = { en: 0, pt: 1, es: 2 }[D.lang];
  var T = { // tipos de inimigo
    drone:  { r: 10, hp: 1, sp: 95,  c: "#ff4d8d", xp: 1,  pts: 10,   sides: 3 },
    tank:   { r: 20, hp: 5, sp: 45,  c: "#ffa53d", xp: 3,  pts: 40,   sides: 6 },
    shard:  { r: 7,  hp: 1, sp: 165, c: "#ffd23d", xp: 1,  pts: 5,    sides: 4 },
    sniper: { r: 13, hp: 3, sp: 70,  c: "#3dd8ff", xp: 2,  pts: 30,   sides: 4 },
    boss:   { r: 54, hp: 70, sp: 36, c: "#b26bff", xp: 25, pts: 1000, sides: 8 }
  };
  var TAU = Math.PI * 2;
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  var game = $("#game"), cv = $("#cv"), ctx = cv.getContext("2d");
  var W = 0, H = 0, neb = null, stars = [], S = null, mode = "menu", keys = {}, ptr = { x: 0, y: 0, on: false, touch: false, lx: 0, ly: 0 }, best = 0;
  try { best = +localStorage.getItem("nebula-best") || 0; } catch (e) { }
  var isTouch = window.matchMedia("(pointer:coarse)").matches;

  /* textos */
  $("#tSub").textContent = L.sub; $("#playBtn").textContent = L.play; $("#againBtn").textContent = L.again; $("#resumeBtn").textContent = L.resume;
  $("#tPaused").textContent = L.paused; $("#tLvl").textContent = L.levelup; $("#tOver").textContent = L.over; $("#tMade").textContent = L.made;
  $("#tHow").textContent = isTouch ? L.howTouch : L.how; $("#tScore").textContent = L.score; $("#tWave").textContent = L.wave; $("#tBest2").textContent = L.best;
  function showBest() { $("#tBest").textContent = L.best + ": " + best.toLocaleString(); }
  showBest();

  /* tamanho + fundo pré-renderizado */
  function resize() {
    var r = game.getBoundingClientRect(); if (!r.width) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    neb = document.createElement("canvas"); neb.width = Math.ceil(W / 2); neb.height = Math.ceil(H / 2);
    var n = neb.getContext("2d"), m = Math.max(neb.width, neb.height);
    n.fillStyle = "#05040d"; n.fillRect(0, 0, neb.width, neb.height);
    [["rgba(139,92,246,.38)", .2, .3, .65], ["rgba(34,211,238,.22)", .85, .2, .5], ["rgba(236,72,153,.22)", .6, .9, .6]].forEach(function (b) {
      var g = n.createRadialGradient(b[1] * neb.width, b[2] * neb.height, 0, b[1] * neb.width, b[2] * neb.height, b[3] * m);
      g.addColorStop(0, b[0]); g.addColorStop(1, "rgba(0,0,0,0)"); n.fillStyle = g; n.fillRect(0, 0, neb.width, neb.height);
    });
    stars = []; for (var i = 0; i < Math.min(260, W * H / 5000); i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: rand(.15, 1) });
    if (S) { S.p.x = clamp(S.p.x, 0, W); S.p.y = clamp(S.p.y, 0, H); }
  }
  new ResizeObserver(resize).observe(game);
  resize();

  /* entrada */
  addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase(); keys[k] = true;
    if ((k === "escape" || k === "p") && (mode === "play" || mode === "pause")) togglePause();
    if (mode === "level" && "123".indexOf(k) >= 0) { var c = $("#cards").children[+k - 1]; if (c) c.click(); }
    if (mode === "play" && ["arrowup", "arrowdown", "arrowleft", "arrowright", " "].indexOf(k) >= 0) e.preventDefault();
  });
  addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
  function local(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener("pointermove", function (e) {
    var q = local(e);
    if (e.pointerType === "mouse") { ptr.x = q[0]; ptr.y = q[1]; ptr.on = true; }
    else if (ptr.touch && S && mode === "play") { S.p.x += (q[0] - ptr.lx) * 1.4; S.p.y += (q[1] - ptr.ly) * 1.4; ptr.lx = q[0]; ptr.ly = q[1]; }
  });
  cv.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse") return;
    var q = local(e); ptr.touch = true; ptr.on = false; ptr.lx = q[0]; ptr.ly = q[1];
    try { cv.setPointerCapture(e.pointerId); } catch (x) { }
  });
  cv.addEventListener("pointerup", function () { ptr.touch = false; });
  cv.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") ptr.on = false; });
  document.addEventListener("visibilitychange", function () { if (document.hidden && mode === "play") togglePause(); });

  /* estado */
  function fresh(demo) {
    return { demo: demo, t: 0, score: 0, wave: 0, kills: 0, combo: 0, comboT: 0, lvl: 1, xp: 0, xpNext: 8, shake: 0, flash: 0,
      spawnQ: 0, spawnT: 0, clearT: 0, bladeA: 0, boss: null,
      p: { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 12, hp: 5, maxHp: 5, inv: 0, speed: 300, fireCd: 0, fireRate: 3.2, dmg: 1, multi: 1, pierce: 0, blades: 0, magnet: 140, ang: -Math.PI / 2 },
      bullets: [], eb: [], enemies: [], parts: [], gems: [], texts: [] };
  }
  function overlay(id) { ["menu", "levelup", "paused", "over"].forEach(function (o) { $("#" + o).hidden = o !== id; }); }
  function start() {
    S = fresh(false); mode = "play"; overlay(null);
    $("#hud").hidden = false; $("#pauseBtn").hidden = false; $("#boss").hidden = true;
    nextWave(); hud();
  }
  function attract() { S = fresh(true); mode = "menu"; S.p.blades = 2; S.p.multi = 2; }
  function togglePause() {
    mode = mode === "play" ? "pause" : "play";
    overlay(mode === "pause" ? "paused" : null);
  }
  function banner(txt) { var b = $("#banner"); b.textContent = txt; b.classList.remove("show"); void b.offsetWidth; b.classList.add("show"); }
  function nextWave() {
    S.wave++; S.spawnQ = 6 + S.wave * 3; S.spawnT = 1.3; S.clearT = 0;
    if (S.wave % 5 === 0) { S.spawnQ = Math.floor(S.spawnQ / 2); spawn("boss"); banner(L.boss); }
    else banner(L.wave + " " + S.wave);
    hud();
  }
  function spawn(type, x, y) {
    var t = T[type], w = S.wave || 1;
    if (x == null) { var a = Math.random() * TAU, R = Math.hypot(W, H) / 2 + 40; x = W / 2 + Math.cos(a) * R; y = H / 2 + Math.sin(a) * R; }
    var hp = type === "boss" ? t.hp + w * 14 : t.hp * (1 + w * .12);
    var e = { type: type, x: x, y: y, vx: 0, vy: 0, r: t.r, hp: hp, max: hp, sp: t.sp * (1 + Math.min(w, 15) * .03), c: t.c, sides: t.sides, rot: Math.random() * TAU, flash: 0, cd: rand(1, 2.5), cd2: 3, bladeCd: 0 };
    S.enemies.push(e);
    if (type === "boss") { S.boss = e; $("#boss").hidden = S.demo; }
    return e;
  }
  function pickType() {
    var w = S.demo ? 4 : S.wave, r = Math.random();
    if (w >= 3 && r < .18) return "sniper";
    if (w >= 2 && r < .42) return "tank";
    return "drone";
  }

  /* efeitos */
  function burst(x, y, c, n, sp, w) {
    for (var i = 0; i < n; i++) { var a = Math.random() * TAU, s = rand(.3, 1) * sp; S.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.35, .8), max: .8, c: c, w: w || 2 }); }
    if (S.parts.length > 700) S.parts.splice(0, S.parts.length - 700);
  }
  function text(x, y, s, c, size) { S.texts.push({ x: x, y: y, s: s, c: c, size: size || 14, life: 1 }); }

  /* combate */
  function damage(e, d) {
    if (e.dead) return;
    e.hp -= d; e.flash = .08;
    burst(e.x, e.y, e.c, 3, 160, 1.5);
    if (e.hp <= 0) kill(e);
  }
  function kill(e) {
    e.dead = true;
    var t = T[e.type];
    burst(e.x, e.y, e.c, e.type === "boss" ? 120 : 14 + e.r, e.type === "boss" ? 520 : 280, e.type === "boss" ? 3 : 2);
    burst(e.x, e.y, "#ffffff", e.type === "boss" ? 40 : 4, 200, 1.5);
    S.shake = Math.min(26, S.shake + (e.type === "boss" ? 26 : e.r / 4));
    for (var g = 0; g < Math.min(t.xp, 8); g++) S.gems.push({ x: e.x + rand(-6, 6), y: e.y + rand(-6, 6), vx: rand(-90, 90), vy: rand(-90, 90), v: Math.ceil(t.xp / Math.min(t.xp, 8)) });
    if (e.type === "tank") for (var k = 0; k < 3; k++) spawn("shard", e.x + rand(-12, 12), e.y + rand(-12, 12));
    if (e.type === "boss") { S.boss = null; $("#boss").hidden = true; S.flash = .6; }
    if (S.demo) return;
    S.kills++; S.combo++; S.comboT = 2.3;
    var mult = Math.min(5, 1 + Math.floor(S.combo / 10) * .5), pts = Math.round(t.pts * mult);
    S.score += pts;
    if (e.type === "boss" || e.type === "tank") text(e.x, e.y - e.r, "+" + pts, "#ffd23d", e.type === "boss" ? 26 : 14);
    if (S.combo % 25 === 0) banner(S.combo + "× " + L.combo);
    hud();
  }
  function hitPlayer(src) {
    var p = S.p;
    if (S.demo || p.inv > 0) return;
    p.hp--; p.inv = 1.1; S.shake = 16; S.combo = 0; S.flash = .25;
    burst(p.x, p.y, "#ffffff", 24, 320, 2);
    if (src && src.type && src.type !== "boss") { var a = Math.atan2(src.y - p.y, src.x - p.x); src.x += Math.cos(a) * 40; src.y += Math.sin(a) * 40; }
    hud();
    if (p.hp <= 0) gameOver();
  }
  function gameOver() {
    mode = "over"; burst(S.p.x, S.p.y, "#7df9ff", 160, 560, 3);
    if (S.score > best) { best = S.score; try { localStorage.setItem("nebula-best", best); } catch (e) { } }
    $("#oScore").textContent = S.score.toLocaleString(); $("#oWave").textContent = S.wave; $("#oBest").textContent = best.toLocaleString();
    showBest();
    setTimeout(function () { overlay("over"); $("#hud").hidden = true; $("#pauseBtn").hidden = true; }, 900);
  }
  function levelUp() {
    mode = "level";
    var pool = UPG.filter(function (u) { return !u.ok || u.ok(S.p); }).sort(function () { return Math.random() - .5; }).slice(0, 3);
    var box = $("#cards"); box.innerHTML = "";
    pool.forEach(function (u, i) {
      var b = document.createElement("button");
      b.className = "upg"; b.style.animationDelay = i * 80 + "ms";
      b.innerHTML = "<i>" + u.ic + "</i><b>" + u.n[LI] + "</b><small>" + u.d[LI] + "</small><kbd>" + (i + 1) + "</kbd>";
      b.onclick = function () { u.f(S.p); overlay(null); mode = "play"; burst(S.p.x, S.p.y, "#7df9ff", 40, 300, 2); hud(); };
      box.appendChild(b);
    });
    overlay("levelup");
    setTimeout(function () { var f = box.firstChild; if (f && !isTouch) f.focus(); }, 50);
  }
  function hud() {
    if (S.demo) return;
    var p = S.p;
    $("#hpBar").style.width = Math.max(0, p.hp / p.maxHp * 100) + "%";
    $("#hpTxt").textContent = Math.max(0, p.hp) + "/" + p.maxHp;
    $("#score").textContent = S.score.toLocaleString();
    $("#combo").textContent = S.combo >= 5 ? "×" + Math.min(5, 1 + Math.floor(S.combo / 10) * .5) + " " + L.combo + " " + S.combo : "";
    $("#waveTxt").innerHTML = L.wave + " <b>" + S.wave + "</b>";
    $("#lvlTxt").innerHTML = L.lvl + " <b>" + S.lvl + "</b>";
    $("#xpBar").style.width = Math.min(100, S.xp / S.xpNext * 100) + "%";
  }

  /* simulação */
  function update(dt) {
    var p = S.p, i, e, b;
    S.t += dt;
    p.inv = Math.max(0, p.inv - dt); S.flash = Math.max(0, S.flash - dt); S.shake = Math.max(0, S.shake - dt * 45);
    if (S.comboT > 0 && (S.comboT -= dt) <= 0) { S.combo = 0; hud(); }

    // movimento
    var mx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0), my = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
    var tx = null, ty = null;
    if (S.demo) { tx = W / 2 + Math.cos(S.t * .55) * W * .28; ty = H / 2 + Math.sin(S.t * .9) * H * .22; }
    else if (mx || my) { var l = Math.hypot(mx, my); p.vx = mx / l * p.speed; p.vy = my / l * p.speed; ptr.on = false; }
    else if (ptr.on) { tx = ptr.x; ty = ptr.y; }
    else { p.vx *= .82; p.vy *= .82; }
    if (tx !== null) { var dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy), s = Math.min(p.speed, d * 6); p.vx = d > 2 ? dx / d * s : 0; p.vy = d > 2 ? dy / d * s : 0; }
    p.x = clamp(p.x + p.vx * dt, p.r, W - p.r); p.y = clamp(p.y + p.vy * dt, p.r, H - p.r);

    // mira automática + tiro
    var tgt = null, bd = 1e12;
    for (i = 0; i < S.enemies.length; i++) { e = S.enemies[i]; var dd = (e.x - p.x) * (e.x - p.x) + (e.y - p.y) * (e.y - p.y); if (dd < bd) { bd = dd; tgt = e; } }
    if (tgt) p.ang = Math.atan2(tgt.y - p.y, tgt.x - p.x);
    else if (Math.hypot(p.vx, p.vy) > 20) p.ang = Math.atan2(p.vy, p.vx);
    p.fireCd -= dt;
    if (tgt && p.fireCd <= 0 && bd < 640 * 640) {
      p.fireCd = 1 / p.fireRate;
      for (i = 0; i < p.multi; i++) {
        var a = p.ang + (i - (p.multi - 1) / 2) * .13;
        S.bullets.push({ x: p.x + Math.cos(a) * 14, y: p.y + Math.sin(a) * 14, vx: Math.cos(a) * 640, vy: Math.sin(a) * 640, life: 1.1, pierce: p.pierce, hit: [] });
      }
    }

    // spawn
    if (S.demo) { if ((S.spawnT -= dt) <= 0 && S.enemies.length < 14) { S.spawnT = .5; spawn(pickType()); } }
    else if (S.spawnQ > 0 && (S.spawnT -= dt) <= 0) { S.spawnT = Math.max(.16, .55 - S.wave * .025); S.spawnQ--; spawn(pickType()); }
    else if (!S.spawnQ && !S.enemies.length && (S.clearT += dt) > 1.4) nextWave();

    // balas
    for (i = S.bullets.length - 1; i >= 0; i--) {
      b = S.bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      var gone = b.life <= 0 || b.x < -20 || b.y < -20 || b.x > W + 20 || b.y > H + 20;
      for (var k = 0; k < S.enemies.length && !gone; k++) {
        e = S.enemies[k];
        if (e.dead || b.hit.indexOf(e) >= 0) continue;
        var ex = e.x - b.x, ey = e.y - b.y;
        if (ex * ex + ey * ey < (e.r + 3) * (e.r + 3)) { damage(e, p.dmg); if (b.pierce-- > 0) b.hit.push(e); else gone = true; }
      }
      if (gone) S.bullets.splice(i, 1);
    }
    for (i = S.eb.length - 1; i >= 0; i--) {
      b = S.eb[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (Math.hypot(b.x - p.x, b.y - p.y) < p.r + 4) { hitPlayer(null); S.eb.splice(i, 1); continue; }
      if (b.life <= 0) S.eb.splice(i, 1);
    }

    // inimigos
    function shoot(e, a, sp) { S.eb.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 4, c: e.c }); }
    for (i = 0; i < S.enemies.length; i++) {
      e = S.enemies[i];
      var ddx = p.x - e.x, ddy = p.y - e.y, dist = Math.hypot(ddx, ddy) || 1, ux = ddx / dist, uy = ddy / dist;
      if (e.type === "sniper") {
        var want = dist > 290 ? 1 : dist < 200 ? -1 : 0;
        e.vx = ux * e.sp * want - uy * e.sp * .8; e.vy = uy * e.sp * want + ux * e.sp * .8;
        if ((e.cd -= dt) <= 0 && dist < 560) { e.cd = 2.4; shoot(e, Math.atan2(ddy, ddx), 215); }
      } else if (e.type === "boss") {
        e.vx = ux * e.sp; e.vy = uy * e.sp;
        if ((e.cd -= dt) <= 0) { e.cd = 1.7; for (var r = 0; r < 14; r++) shoot(e, r / 14 * TAU + e.rot, 165); }
        if ((e.cd2 -= dt) <= 0) { e.cd2 = 4.5; for (r = 0; r < 3; r++) spawn("drone", e.x + rand(-40, 40), e.y + rand(-40, 40)); }
        if (!S.demo) $("#bossBar").style.width = Math.max(0, e.hp / e.max * 100) + "%";
      } else {
        var k2 = Math.min(1, dt * 3); e.vx += (ux * e.sp - e.vx) * k2; e.vy += (uy * e.sp - e.vy) * k2;
      }
      e.x += e.vx * dt; e.y += e.vy * dt; e.rot += dt * (e.type === "boss" ? .5 : 2.2); e.flash -= dt; e.bladeCd -= dt;
      if (dist < e.r + p.r) hitPlayer(e);
      for (var j = i + 1; j < S.enemies.length; j++) { // separação para não empilhar
        var o = S.enemies[j], sx = o.x - e.x, sy = o.y - e.y, sd = Math.hypot(sx, sy) || 1, min = o.r + e.r;
        if (sd < min) { var push = (min - sd) / 2 / sd; o.x += sx * push; o.y += sy * push; e.x -= sx * push; e.y -= sy * push; }
      }
    }

    // lâminas orbitais
    if (p.blades) {
      S.bladeA += dt * 3.4;
      for (i = 0; i < p.blades; i++) {
        var ba = S.bladeA + i * TAU / p.blades, bx = p.x + Math.cos(ba) * 58, by = p.y + Math.sin(ba) * 58;
        for (k = 0; k < S.enemies.length; k++) { e = S.enemies[k]; if (!e.dead && e.bladeCd <= 0 && Math.hypot(e.x - bx, e.y - by) < e.r + 9) { e.bladeCd = .25; damage(e, p.dmg); } }
        for (k = S.eb.length - 1; k >= 0; k--) if (Math.hypot(S.eb[k].x - bx, S.eb[k].y - by) < 12) { burst(bx, by, "#7df9ff", 4, 120, 1.5); S.eb.splice(k, 1); }
      }
    }
    S.enemies = S.enemies.filter(function (x) { return !x.dead; });

    // gemas de XP
    for (i = S.gems.length - 1; i >= 0; i--) {
      var g = S.gems[i], gx = p.x - g.x, gy = p.y - g.y, gd = Math.hypot(gx, gy) || 1;
      if (gd < p.magnet) { g.vx += gx / gd * 1400 * dt; g.vy += gy / gd * 1400 * dt; }
      g.vx *= 1 - dt * 3; g.vy *= 1 - dt * 3; g.x += g.vx * dt; g.y += g.vy * dt;
      if (gd < p.r + 6) {
        S.gems.splice(i, 1);
        if (S.demo) continue;
        S.xp += g.v;
        if (S.xp >= S.xpNext) { S.xp -= S.xpNext; S.lvl++; S.xpNext = Math.round(S.xpNext * 1.45 + 4); hud(); levelUp(); return; }
        hud();
      }
    }

    // partículas e textos
    for (i = S.parts.length - 1; i >= 0; i--) { b = S.parts[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= 1 - dt * 3.2; b.vy *= 1 - dt * 3.2; if ((b.life -= dt) <= 0) S.parts.splice(i, 1); }
    for (i = S.texts.length - 1; i >= 0; i--) { b = S.texts[i]; b.y -= 40 * dt; if ((b.life -= dt) <= 0) S.texts.splice(i, 1); }
  }

  /* render */
  function poly(x, y, r, n, rot) { ctx.beginPath(); for (var i = 0; i <= n; i++) { var a = rot + i / n * TAU; ctx[i ? "lineTo" : "moveTo"](x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); }
  function draw() {
    var p = S.p, i, e, b;
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(neb, 0, 0, W, H);
    ctx.save();
    if (S.shake) ctx.translate(rand(-1, 1) * S.shake, rand(-1, 1) * S.shake);

    // grade + estrelas (parallax)
    var off = (S.t * 18) % 48;
    ctx.strokeStyle = "rgba(125,249,255,.045)"; ctx.lineWidth = 1; ctx.beginPath();
    for (var gx = -off; gx < W; gx += 48) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
    for (var gy = off - 48; gy < H; gy += 48) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
    ctx.stroke();
    for (i = 0; i < stars.length; i++) {
      var st = stars[i], sx = ((st.x - p.x * st.z * .06) % W + W) % W, sy = ((st.y + S.t * 12 * st.z - p.y * st.z * .06) % H + H) % H;
      ctx.fillStyle = "rgba(220,230,255," + st.z * .8 + ")"; ctx.fillRect(sx, sy, st.z * 2, st.z * 2);
    }

    ctx.globalCompositeOperation = "lighter";
    // gemas
    for (i = 0; i < S.gems.length; i++) { b = S.gems[i]; ctx.fillStyle = "rgba(125,249,255,.25)"; ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, TAU); ctx.fill(); ctx.fillStyle = "#7df9ff"; poly(b.x, b.y, 3.5, 4, S.t * 3); ctx.fill(); }
    // inimigos
    for (i = 0; i < S.enemies.length; i++) {
      e = S.enemies[i];
      ctx.fillStyle = e.c + "22"; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.9, 0, TAU); ctx.fill();
      poly(e.x, e.y, e.r, e.sides, e.rot);
      ctx.fillStyle = e.flash > 0 ? "#ffffff" : e.c + "33"; ctx.fill();
      ctx.strokeStyle = e.c; ctx.lineWidth = e.type === "boss" ? 3 : 2; ctx.stroke();
      if (e.type === "boss") {
        poly(e.x, e.y, e.r * .6, 4, -e.rot * 2); ctx.strokeStyle = "#ff4d8d"; ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(e.x, e.y, 6 + Math.sin(S.t * 8) * 2, 0, TAU); ctx.fill();
      } else if (e.type === "tank") { poly(e.x, e.y, e.r * .45, 3, -e.rot); ctx.stroke(); }
    }
    // balas inimigas
    for (i = 0; i < S.eb.length; i++) { b = S.eb[i]; ctx.fillStyle = "rgba(255,120,80,.3)"; ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, TAU); ctx.fill(); ctx.fillStyle = "#ffb08a"; ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, TAU); ctx.fill(); }
    // balas do jogador
    ctx.lineCap = "round";
    for (i = 0; i < S.bullets.length; i++) { b = S.bullets[i]; ctx.strokeStyle = "rgba(125,249,255,.35)"; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .025, b.y - b.vy * .025); ctx.stroke(); ctx.strokeStyle = "#e9feff"; ctx.lineWidth = 2.5; ctx.stroke(); }
    // lâminas
    for (i = 0; i < p.blades; i++) {
      var ba = S.bladeA + i * TAU / p.blades, bx = p.x + Math.cos(ba) * 58, by = p.y + Math.sin(ba) * 58;
      ctx.fillStyle = "rgba(178,107,255,.3)"; ctx.beginPath(); ctx.arc(bx, by, 12, 0, TAU); ctx.fill();
      poly(bx, by, 8, 4, ba * 2); ctx.fillStyle = "#e3c9ff"; ctx.fill();
    }
    // nave
    if (mode !== "over" && !(p.inv > 0 && (S.t * 18 | 0) % 2)) {
      ctx.fillStyle = "rgba(125,249,255,.18)"; ctx.beginPath(); ctx.arc(p.x, p.y, 26, 0, TAU); ctx.fill();
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang);
      var fl = 8 + Math.random() * 8 + Math.hypot(p.vx, p.vy) / 30;
      ctx.fillStyle = "rgba(255,150,60,.85)"; ctx.beginPath(); ctx.moveTo(-8, -5); ctx.lineTo(-8 - fl, 0); ctx.lineTo(-8, 5); ctx.fill();
      ctx.fillStyle = "#0b1a2a"; ctx.strokeStyle = "#7df9ff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -11); ctx.lineTo(-5, 0); ctx.lineTo(-10, 11); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      if (p.magnet > 200) { ctx.strokeStyle = "rgba(125,249,255,.06)"; ctx.beginPath(); ctx.arc(p.x, p.y, p.magnet, 0, TAU); ctx.stroke(); }
    }
    // partículas
    for (i = 0; i < S.parts.length; i++) { b = S.parts[i]; ctx.globalAlpha = Math.max(0, b.life / b.max); ctx.strokeStyle = b.c; ctx.lineWidth = b.w; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .04, b.y - b.vy * .04); ctx.stroke(); }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    for (i = 0; i < S.texts.length; i++) { b = S.texts[i]; ctx.globalAlpha = Math.min(1, b.life * 2); ctx.fillStyle = b.c; ctx.font = "900 " + b.size + "px Orbitron, sans-serif"; ctx.textAlign = "center"; ctx.fillText(b.s, b.x, b.y); }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (S.flash) { ctx.fillStyle = "rgba(255,255,255," + S.flash * .5 + ")"; ctx.fillRect(0, 0, W, H); }
  }

  /* loop */
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(.033, (now - last) / 1000); last = now;
    if (W && S) {
      if (mode === "play" || mode === "menu") update(dt);
      else if (mode === "over") { S.t += dt; S.shake = Math.max(0, S.shake - dt * 45); for (var i = S.parts.length - 1; i >= 0; i--) { var b = S.parts[i]; b.x += b.vx * dt; b.y += b.vy * dt; if ((b.life -= dt) <= 0) S.parts.splice(i, 1); } }
      draw();
    }
    requestAnimationFrame(frame);
  }
  $("#playBtn").onclick = start;
  $("#againBtn").onclick = start;
  $("#resumeBtn").onclick = togglePause;
  $("#pauseBtn").onclick = function () { if (mode === "play" || mode === "pause") togglePause(); };
  attract();
  if (D.shot) { // miniatura do portfólio: adianta ~6s de partida com chefe na tela
    S.p.blades = 4; S.p.multi = 3; spawn("boss", W * .8, H * .3);
    for (var f = 0; f < 360; f++) update(1 / 60);
    $("#menu").style.background = "radial-gradient(circle at 50% 45%, rgba(5,4,13,.15), rgba(5,4,13,.5))";
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
